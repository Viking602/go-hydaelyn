name: ci

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  core-test:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Verify module path
        run: |
          test "$(go list -m)" = "github.com/Viking602/go-hydaelyn"

      - name: Run tests
        run: go test ./...

      - name: Run race tests
        run: go test -race -timeout=10m ./...

      - name: Run coverage tests
        run: go test ./... -coverprofile=coverage.out

      - name: Upload coverage artifact
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage.out
          if-no-files-found: error
          retention-days: 30

  static-analysis:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Install analysis tools
        run: |
          go install honnef.co/go/tools/cmd/staticcheck@latest
          go install golang.org/x/vuln/cmd/govulncheck@latest
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Verify gofmt
        run: |
          diff=$(gofmt -l .)
          if [ -n "$diff" ]; then
            echo "::error::gofmt issues in the following files:"
            echo "$diff"
            exit 1
          fi

      - name: Verify go mod tidy
        run: |
          go mod tidy
          git diff --exit-code -- go.mod go.sum

      - name: Run go vet
        run: go vet ./...

      - name: Run staticcheck
        run: staticcheck ./...

      - name: Run govulncheck
        run: govulncheck ./...

  golangci-lint:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@v8
        with:
          # v8 action supports golangci-lint v2; v6 only ships v1 binaries
          # built with go 1.24 which can't load configs targeting go 1.25.
          # v2.12.0 is the latest official upstream release (homebrew may
          # ship a patched 2.12.1 that doesn't exist on GitHub).
          version: v2.12.0
          args: --timeout=5m
          # only-new-issues=true makes the gate fail ONLY on issues
          # introduced by this PR vs. the merge-base with main. Existing
          # baseline (~40 issues at the time this gate was added) is
          # tracked separately and cleaned up in follow-up PRs. This avoids
          # the classic chicken-and-egg where adding the gate would block
          # itself on pre-existing debt.
          only-new-issues: true

  architecture-gate:
    runs-on: ubuntu-latest

    env:
      SENTRUX_VERSION: v0.5.7

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Install sentrux binary
        run: |
          curl -fsSL -o /usr/local/bin/sentrux \
            "https://github.com/sentrux/sentrux/releases/download/${SENTRUX_VERSION}/sentrux-linux-x86_64"
          chmod +x /usr/local/bin/sentrux
          sentrux --version

      - name: Install Go grammar plugin
        run: |
          if [ -d "$HOME/.sentrux/plugins/go" ]; then
            echo "go plugin already installed at $HOME/.sentrux/plugins/go"
          else
            sentrux plugin add go
          fi

      - name: Architectural rules (.sentrux/rules.toml)
        run: sentrux check .

      - name: Framework business-word boundary (ADR-008)
        run: ./scripts/check-business-words.sh

  release-soak:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Run repeatability soak
        run: go test ./... -count=20

      - name: Run race soak
        run: go test -race -timeout=10m ./... -count=5
