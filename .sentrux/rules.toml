# Venat architectural rules — enforced via `sentrux check`.
# See ADR-008 and ADR-024 for the framework-vs-business and five-layer
# boundaries that motivate these rules.
#
# Strategy notes:
# - Layers are documented as five (Packs → Worker integration →
#   Multi-Agent → Agent Loop → Durable Runner) but are NOT modeled with
#   Sentrux layer_direction. Sentrux 0.5.7 forbids any cross-layer import
#   once layers are declared, which is too coarse for the façade →
#   internal/core composition root and for worker → root integration.
# - Path-scoped import seams are enforced by
#   scripts/check-import-boundaries.sh from the compiled package graph:
#
#   api                    — no Venat imports
#   agent                  — no multiagent imports
#   multiagent             — no root, worker, or internal imports
#   root package facade    — no multiagent imports
#   worker                 — no packs or coding imports (may import root)
#   packs                  — no coding, worker, or root imports
#   coding                 — no worker, packs, or root imports
#
# multiagent → stream is intentionally allowed: stream is a runtime-neutral
# collaboration primitive, not an upward dependency on the durable Runner.
# worker → root is the integration seam (ADR-024).
#
#   internal/core/model      — stdlib only; no internal/core/* imports
#   internal/core/ports      — model only
#   internal/memory          — development/test StoreProvider; not a
#                              Position D reference implementation
#   internal/core/state      — model only; pure functions
#   internal/command         — model + ports only
#   internal/blackboard      — handler/service over generic BlackboardItem
#   service/domain packages  — model, ports, state, other services
#                              NO root internal/core import
#                              NO venat / orchestrator / worker import
#                              NO internal/core/application import
#   internal/core            — Runtime façade/composition root; wires domain
#                              packages and keeps public compatibility aliases
#   internal/{run,report,...} — domain behavior packages
#
# Script-based gates run in CI and `make architecture-check`:
#   scripts/check-business-words.sh  — framework/business vocabulary boundary
#   scripts/check-public-any.sh      — public []any return and any-field contract
#   scripts/check-import-boundaries.sh — path-scoped import seams via go list

[constraints]
# Acyclic always.
max_cycles = 0
# Per-file coupling ceiling.
max_coupling = "B"
# No file may depend on more than ~15 modules.
no_god_files = true
