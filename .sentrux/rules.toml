# Hydaelyn architectural rules — enforced via `sentrux check`.
# See ADR-008 for the framework-vs-business boundary that motivates these rules.
#
# Strategy notes:
# - Layers were intentionally NOT modeled here. Sentrux 0.5.7's layer_direction
#   forbids any cross-layer import once layers are declared, which is too coarse
#   for our boundaries (e.g., orchestrator façade → internal/core).
# - The legacy/* tree was deleted in M6 (v2.0); historical legacy code is
#   preserved on the archive/legacy-v1 branch, not in main.
#
# Sentrux 0.5.7 enforces the graph-wide constraints below, but cannot express
# these path-scoped import rules precisely. They are enforced from the compiled
# package graph by scripts/check-import-boundaries.sh instead:
#
#   api                    — no Hydaelyn imports
#   agent                  — no multiagent imports
#   multiagent             — no root, worker, or internal imports
#   root package facade    — no multiagent imports
#
# multiagent → stream is intentionally allowed: stream is a runtime-neutral
# collaboration primitive, not an upward dependency on the durable Runner.
#
#   internal/core/model      — stdlib only; no internal/core/* imports
#   internal/core/ports      — model only
#   internal/memory          — model + ports only; no service packages
#   internal/core/state      — model only; pure functions
#   internal/command         — model + ports only
#   internal/blackboard      — model + ports (service struct injection)
#   service/domain packages  — model, ports, state, other services
#                              NO root internal/core import
#                              NO hydaelyn / orchestrator / worker import
#                              NO internal/core/application import
#   internal/core            — Runtime façade/composition root; wires domain
#                              packages and keeps public compatibility aliases
#   internal/{run,report,...} — domain behavior packages
#
# Script-based gates run in CI and `make architecture-check`:
#   scripts/check-business-words.sh  — framework/business vocabulary boundary
#   scripts/check-public-any.sh      — public []any return and any-field contract
#   scripts/check-import-boundaries.sh — four path-scoped import seams via go list

[constraints]
# Acyclic always.
max_cycles = 0
# Per-file coupling ceiling.
max_coupling = "B"
# No file may depend on more than ~15 modules.
no_god_files = true
