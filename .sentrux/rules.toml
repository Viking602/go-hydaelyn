# Hydaelyn architectural rules — enforced via `sentrux check`.
# See ADR-008 for the framework-vs-business boundary that motivates these rules.
#
# Strategy notes:
# - Layers were intentionally NOT modeled here. Sentrux 0.5.7's layer_direction
#   forbids any cross-layer import once layers are declared, which is too coarse
#   for our boundaries (e.g., orchestrator façade → internal/core).
# - The legacy/* tree was deleted in M6 (v2.0); historical legacy code is
#   preserved on the archive/legacy-v1 branch, not in main.
#
# Sub-package boundary intent (enforced manually via grep gates until sentrux
# supports path-scoped import rules natively):
#
#   internal/core/model      — stdlib only; no internal/core/* imports
#   internal/core/ports      — model only
#   internal/core/memory     — model + ports only; no service packages
#   internal/core/state      — model only; pure functions
#   internal/core/command    — model + ports only
#   internal/core/blackboard — model + ports (service struct injection)
#   service packages         — model, ports, state, other services
#                              NO root internal/core import
#                              NO hydaelyn / orchestrator / worker import
#                              NO internal/core/application import
#   internal/core/application — may import service packages; is the top of
#                               the internal domain stack
#   internal/core (root)     — composition root only; wires everything
#
# Grep-based gates run in CI (see Makefile or scripts/check-boundaries.sh):
#   grep -R "Locked(" internal/core/{mailbox,blackboard,execution,...}
#   grep -R "fallback" internal/core/{mailbox,execution,...}
#   grep -R "subscriptionHub" internal/core/{mailbox,execution,...}

[constraints]
# Acyclic always.
max_cycles = 0
# Per-file coupling ceiling.
max_coupling = "B"
# No file may depend on more than ~15 modules.
no_god_files = true
